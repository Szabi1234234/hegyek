<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <input type="file" name="file" id="fileinput"  onchange="olvas(this)">
    </div>
    <div class="idk">1</div>

</body>
<script>
    function olvas(mit){
        let file = mit.files[0];
        let olvaso = new FileReader();

        olvaso.readAsText(file);
        olvaso.onload = function(){
            let tartalom = olvaso.result;
            console.log(tartalom);
            
            class hegycsucs{
                constructor(nev, hegyseg, magassag){
                    this.nev = nev;
                    this.hegyseg = hegyseg;
                    this.magassag = magassag;
                }
            }
        
            let hegyek = [];
            let sorok = tartalom.split("\n");
            for (let i = 1; i < sorok.length; i++)
            {
                let darabok = sorok[i].split(";");
                let h = new hegycsucs(darabok[0], darabok[1], parseInt(darabok[2]));
                hegyek.push(h);

            }   
            console.log(hegyek);

            console.log("hegyek száma: " + hegyek.length);

            let osszeg = 0;
            for (const h of hegyek) {

                osszeg += h.magassag;
                
            }

            console.log("magasságok átlaga: " + osszeg / hegyek.length);
            
            let max = hegyek[0];
            for (const h of hegyek) {
                if(h.magassag > max.magassag){
                    max = h;
                }
            }
            
            console.log("legmagasabb hegycsúcs: " + max.nev + " , " + max.magassag + " m");

            let beolvmagassag = parseInt(window.prompt("Irj be egy magasságot!"))
            console.log("beolvasott magasság: " + beolvmagassag + " m");
            let van = false;

            for (const h of hegyek) {
                if(h.hegyseg === "Börzsöny" && h.magassag > beolvmagassag){
                    van = true;
                    break;
                }
                
            }
            if(van){
                console.log("van magasabb")
            }
            else{
                console.log("Nincs magasabb")
            }
            

            const lab = 3.280839895
            let db = 0;
            for (const h of hegyek) {
                if(h.magassag * lab > 3000){
                    db++;
                }
            }
            console.log("3000 lábnál magasabb hegyek száma: " + db);

            let hegysegek = new Set();
            for (const h of hegyek) {
                hegysegek.add(h.hegyseg);
            }

            for(const hegyseg of hegysegek){
                let db = 0;
                for (const h of hegyek) {
                    if(h.hegyseg === hegyseg){
                        db++;
                    }
                }
                console.log(hegyseg + ": " + db + " db");
            }


            for (const h of hegyek) {
                if(h.hegyseg === "Bükk-vidék"){
                    let labmagas = Math.round(h.magassag * lab* 10) / 10;
                    console.log(h.nev + ";" +labmagas)
                }
            }




        }   



        
    }
</script>

</html>
