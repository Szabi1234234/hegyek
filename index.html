<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="file" name="file" id="fileinput"  onchange="olvas(this)">

</body>
<script>
    function olvas(mit){
        let file = mit.files[0];
        let olvaso = new FileReader();

        olvaso.readAsText(file);
        olvaso.onload = function(){
            let tartalom = olvaso.result;
            console.log(tartalom);
            
            class hegycsucs{
                constructor(nev, hegyseg, magassag){
                    this.nev = nev;
                    this.hegyseg = hegyseg;
                    this.magassag = magassag;
                }
            }
        
            let hegyek = [];
            let sorok = tartalom.split("\n");
            for (let i = 1; i < sorok.length; i++)
            {
                let darabok = sorok[i].split(";");
                let h = new hegycsucs(darabok[0], darabok[1], parseInt(darabok[2]));
                hegyek.push(h);

            }   
            console.log(hegyek);

            console.log("hegyek száma: " + hegyek.length);

            let osszeg = 0;
            for (const h of hegyek) {

                osszeg += h.magassag;
                
            }

            console.log("magasságok átlaga: " + osszeg / hegyek.length);
            
            let max = hegyek[0];
            for (const h of hegyek) {
                if(h.magassag > max.magassag){
                    max = h;
                }
            }
            
            console.log("legmagasabb hegycsúcs: " + max.nev + " , " + max.magassag + " m");
        }   
        
    }
</script>

</html>
